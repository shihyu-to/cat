<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高科大計概考題：雜湊表視覺化 (h(k) = k mod 7)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="number"] {
            background-color: #2a2a2a;
            border: 2px solid #333;
            color: #f0f0f0;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1em;
            width: 150px;
        }

        button {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .table-visual {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .cell-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background-color: #333;
            border: 2px solid #444;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            transition: background-color 0.3s, transform 0.2s;
            position: relative;
        }

        .cell.filled {
            background-color: #2e7d32; /* Green for success */
        }

        .cell.collision-initial {
            background-color: #c62828; /* Red for initial collision */
            animation: pulse 0.5s;
        }

        .cell.probing {
            background-color: #f9a825; /* Yellow for probing */
            transform: scale(1.05);
        }

        .index-label {
            margin-top: 8px;
            font-size: 0.9em;
            color: #aaa;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .log-panel {
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .log-title {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .log-entry {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            color: #ccc;
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 3px solid transparent;
        }

        .log-entry.success {
            color: #4CAF50;
            border-left-color: #4CAF50;
        }

        .log-entry.collision {
            color: #c62828;
            border-left-color: #c62828;
        }

        .log-entry.probing {
            color: #f9a825;
            border-left-color: #f9a825;
        }

    </style>
</head>
<body>

    <h1>雜湊表視覺化工具</h1>
    <div class="subtitle">h(k) = k mod 7 (平方探測法 Quadratic Probing)</div>

    <div class="input-area">
        <input type="number" id="keyInput" placeholder="輸入整數鍵值 (Key)" min="0">
        <button onclick="insertKey()">插入鍵值</button>
    </div>

    <div class="table-visual" id="hashTableVisual">
        <!-- Cells will be generated here by JS -->
    </div>

    <div class="log-panel">
        <div class="log-title">運算記錄與分析：</div>
        <div id="logArea">插入鍵值後，此處將顯示計算與碰撞處理過程...</div>
    </div>

    <script>
        // 1. 初始化雜湊表陣列 (大小為 7)
        const TABLE_SIZE = 7;
        let hashTable = new Array(TABLE_SIZE).fill(null);

        // 2. 獲取網頁元素
        const visualContainer = document.getElementById('hashTableVisual');
        const logArea = document.getElementById('logArea');
        const keyInput = document.getElementById('keyInput');

        // 3. 在網頁上渲染出 7 個格子
        function renderTable() {
            visualContainer.innerHTML = ''; // 清空重新渲染
            for (let i = 0; i < TABLE_SIZE; i++) {
                const cellContainer = document.createElement('div');
                cellContainer.className = 'cell-container';

                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                
                // 如果格子內有數字，顯示數字並標記為 'filled'
                if (hashTable[i] !== null) {
                    cell.textContent = hashTable[i];
                    cell.classList.add('filled');
                }

                const label = document.createElement('div');
                label.className = 'index-label';
                label.textContent = `Index ${i}`;

                cellContainer.appendChild(cell);
                cellContainer.appendChild(label);
                visualContainer.appendChild(cellContainer);
            }
        }

        // 4. 清除特定格子的動畫標記
        function clearCellClasses() {
            for (let i = 0; i < TABLE_SIZE; i++) {
                const cell = document.getElementById(`cell-${i}`);
                cell.classList.remove('collision-initial', 'probing');
            }
        }

        // 5. 記錄訊息到面板
        function logMsg(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logArea.appendChild(entry);
            // 自動滾動到底部
            logArea.scrollTop = logArea.scrollHeight;
        }

        // 6. 核心插入邏輯 (實作 k mod 7 與平方探測)
        async function insertKey() {
            const keyValue = parseInt(keyInput.value);
            if (isNaN(keyValue)) {
                logMsg('請輸入有效的整數。', 'collision');
                return;
            }
            keyInput.value = ''; // 清空輸入框
            clearCellClasses(); // 重置上一次的動畫

            logMsg(`--- 開始插入鍵值 ${keyValue} ---`);

            // (a) 計算初始雜湊結果: h(k) = key mod 7
            let initialIndex = keyValue % TABLE_SIZE;
            logMsg(`計算 h(${keyValue}) = ${keyValue} mod 7 = ${initialIndex}。`);

            let currentIndex = initialIndex;
            let currentCell = document.getElementById(`cell-${currentIndex}`);

            // 檢查初始位置是否為空
            if (hashTable[currentIndex] === null) {
                // (c) 成功插入：Index 為空格子
                hashTable[currentIndex] = keyValue;
                logMsg(`Index ${currentIndex} 為空格子。成功插入鍵值 ${keyValue}！`, 'success');
                renderTable(); // 更新畫面
                return;
            }

            // --- 觸發碰撞 (Collision) ---
            // (c) 對應題目內容：Index currentIndex 已有數字，觸發碰撞！
            logMsg(`Index ${currentIndex} 已存在 ${hashTable[currentIndex]}。發生碰撞！`, 'collision');
            currentCell.classList.add('collision-initial'); // 標記為碰撞初始點
            await new Promise(r => setTimeout(r, 600)); // 延遲，讓動畫可見

            // --- 啟動平方探測法 (Quadratic Probing) ---
            // 公式: (原始目標 Index + i^2) mod 7，i = 1, 2, 3...
            let i = 1;
            let probingCount = 0;

            while (probingCount < TABLE_SIZE) {
                // 計算新的目標位置
                // currentIndex 是原始 Index
                let probingIndex = (initialIndex + i * i) % TABLE_SIZE;
                logMsg(`平方探測第 ${i} 次跳躍: (${initialIndex} + ${i}^2) mod 7 = ${probingIndex}。`, 'probing');
                
                let nextCell = document.getElementById(`cell-${probingIndex}`);
                nextCell.classList.add('probing'); // 標記正在探測的格子
                await new Promise(r => setTimeout(r, 600)); // 延遲

                // 檢查新的格子是否為空
                if (hashTable[probingIndex] === null) {
                    // (c) 找到空格子：對應題目 (c) 的最終降落地點
                    hashTable[probingIndex] = keyValue;
                    logMsg(`找到空格子 Index ${probingIndex}。成功插入鍵值 ${keyValue}！`, 'success');
                    renderTable(); // 更新畫面，顯示數字
                    return;
                }

                // 新的格子依然發生碰撞，繼續探測
                logMsg(`Index ${probingIndex} 仍被 ${hashTable[probingIndex]} 佔用。持續碰撞！`, 'collision');
                await new Promise(r => setTimeout(r, 300)); // 短延遲
                
                i++; // 平方探測次數遞增
                probingCount++; // 安全計數，防止死迴圈
            }

            // 探測 TABLE_SIZE 次都找不到空格子，雜湊表已滿
            logMsg(`探測了 ${TABLE_SIZE} 次均未找到空格子。雜湊表可能已滿，無法插入 ${keyValue}。`, 'collision');
            renderTable(); // 更新畫面，移除動畫標記
        }

        // 初始渲染
        renderTable();

    </script>
</body>
</html>
